name: Quarterly Metrics Pipeline

on:
  schedule:
    # 03:00 UTC on the 1st of Mar/Jun/Sep/Dec
    - cron: "0 3 1 3,6,9,12 *"
  workflow_dispatch: {}

concurrency:
  group: quarterly-metrics
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rgbif
            any::dplyr
            any::tidyr
            any::jsonlite
            any::httr

      - name: Run metrics pipeline (excluding long-running species count maps)
        working-directory: metrics
        env:
          GBIF_USER: ${{ secrets.GBIF_USER }}
          GBIF_PWD: ${{ secrets.GBIF_PWD }}
          GBIF_EMAIL: ${{ secrets.GBIF_EMAIL }}
        run: |
          chmod +x run-metrics-pipeline.sh
          ./run-metrics-pipeline.sh --skip export-geojson

      - name: Commit and push updated JSON data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ui/public/data
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: quarterly metrics data refresh $(date +%Y-%m-%d)"
            git push
          fi
