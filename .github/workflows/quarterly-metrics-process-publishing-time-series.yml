name: Quarterly Metrics - Publisher Time Series

on:
  schedule:
    # 05:15 UTC on the 1st of Mar/Jun/Sep/Dec
    - cron: "15 5 1 3,6,9,12 *"
  workflow_dispatch: {}

concurrency:
  group: quarterly-metrics-process-publishing-time-series
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rgbif
            any::dplyr
            any::tidyr
            any::jsonlite
            any::httr

      - name: Run process-publishing-time-series metric
        working-directory: metrics
        env:
          GBIF_USER: ${{ secrets.GBIF_USER }}
          GBIF_PWD: ${{ secrets.GBIF_PWD }}
          GBIF_EMAIL: ${{ secrets.GBIF_EMAIL }}
        run: |
          chmod +x run-metrics-pipeline.sh
          ./run-metrics-pipeline.sh --only process-publishing-time-series

      - name: Commit and push updated JSON data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ui/public/data
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: publisher time series metrics refresh $(date +%Y-%m-%d)"
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && break
              echo "Push failed, retrying ($i)..."
              sleep $((i * 10))
            done
          fi
